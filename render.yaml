# Render Blueprint: lunch picker API
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: food-picker-catmeme-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm --prefix backend ci || npm --prefix backend install
    startCommand: npm --prefix backend run start:render
    healthCheckPath: /v1/restaurants
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_MINUTES
        value: "30"
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "30"
      - key: JWT_RESET_PASSWORD_EXPIRATION_MINUTES
        value: "10"
      - key: JWT_VERIFY_EMAIL_EXPIRATION_MINUTES
        value: "10"
